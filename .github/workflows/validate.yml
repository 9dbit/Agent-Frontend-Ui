name: Validate frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test frontend UI
        run: node --test tests/ui.test.mjs
      - name: Test video warmup
        run: node --test tests/video-warmup.test.mjs
      - name: Test remaining modules
        run: node --test tests/client-demo.test.mjs tests/discovery.test.mjs tests/proxy.test.mjs tests/seo.test.mjs tests/server.test.mjs tests/state.test.mjs
