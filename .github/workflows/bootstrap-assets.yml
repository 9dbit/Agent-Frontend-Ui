name: Restore and verify captured frontend assets
on:
  push:
    branches: [feat/playground-frontend-20261103]
    paths:
      - .github/workflows/bootstrap-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore exact captured asset bytes
        run: python3 scripts/restore-assets.py
      - name: Verify frontend and workflows
        run: npm run build && npm test
      - name: Save verified assets to the feature branch
        run: |
          git add public/assets
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: restore verified frontend image assets'
          git push
